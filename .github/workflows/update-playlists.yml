name: Build playlists

on:
  schedule:
    # GitHub cron is UTC; 00:00 UTC is 08:00 Asia/Singapore (UTC+8).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-generated-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
      - name: Install VLC playback probe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends vlc
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.13"
      - name: Check playlist URLs and refresh inaccessible streams
        run: python scripts/refresh_sources.py --max-workers 6 --decode-seconds 5
      - name: Build language-specific playlist
        run: python scripts/build_playlists.py
      - name: Validate outputs
        run: python scripts/validate_repo.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel.md manifest.json playlist.m3u reports/daily-refresh.json reports/stream-speed.json
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "build: refresh language-specific playlist"
            git push
          fi
